<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code de confirmation</title></head>
<body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c1f26;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;">
    <tr><td>
      <h1 style="margin:0 0 16px;font-size:22px;">Code de confirmation</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Saisis ce code dans l'app pour confirmer l'opération (il expire dans une heure).</p>
      <p style="margin:0;font-size:32px;font-weight:700;letter-spacing:6px;">{{ .Token }}</p>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b7280;">Si tu n'es pas à l'origine de cette demande, ignore simplement cet e-mail : rien ne sera modifié.</p>
    </td></tr>
  </table>
</body>
</html>
